<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METV | VOD</title>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
    <style>
        :root { --main-bg: #0b0c10; --card-bg: #1f2833; --accent: #66fcf1; --text: #c5c6c7; }
        body { background: var(--main-bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        /* Arama Paneli (Sola Yaslı Logo) */
        .aramapanel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #161b22;
            border-bottom: 2px solid var(--accent);
        }
        .aramapanelsol { display: flex; align-items: center; gap: 12px; }
        .logo img { width: 45px; height: 45px; object-fit: contain; filter: drop-shadow(0 0 5px var(--accent)); }
        .logoisim { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: 1px; }

        .aramapanelsag form { display: flex; gap: 5px; }
        .aramapanelyazi {
            padding: 8px 15px; border-radius: 20px; border: 1px solid var(--accent);
            background: #000; color: #fff; outline: none; width: 180px;
        }
        .aramapanelbuton {
            padding: 8px 15px; border-radius: 20px; border: none;
            background: var(--accent); color: #000; font-weight: bold; cursor: pointer;
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 15px; }
        .hidden { display: none !important; }

        /* Kartlar */
        .card { position: relative; background: var(--card-bg); border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 1px solid #45a29e33; }
        .card:hover { transform: scale(1.03); border-color: var(--accent); }
        .card img { width: 100%; height: 210px; object-fit: cover; display: block; }
        .badge-imdb { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.85); color: #EEBF16; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; z-index: 5; }
        .card-info { padding: 8px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); text-align: center; }
        .card-title { font-size: 11px; font-weight: bold; color: var(--accent); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

        /* Bölüm Sayfası */
        .bolum-header { padding: 25px; display: flex; align-items: center; gap: 20px; background: #161b22; border-bottom: 1px solid #45a29e33; }
        .bolum-header img { width: 80px; height: 110px; border-radius: 6px; object-fit: cover; }
        .last-episodes { display: flex; flex-wrap: wrap; gap: 12px; padding: 15px; }
        .episode-item { width: calc(50% - 6px); }
        .episode-item a { display: flex; align-items: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; text-decoration: none; border: 1px solid transparent; transition: 0.2s; }
        .episode-item a:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); }
        .episode-item img { width: 90px; height: 55px; border-radius: 4px; margin-right: 12px; object-fit: cover; background: #000; }
        .ep-info { flex: 1; overflow: hidden; }
        .ep-title { display: block; color: #fff; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ep-sub { font-size: 11px; color: var(--accent); }

        /* Player */
        #loading-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:20000; flex-direction:column; align-items:center; justify-content:center; color:var(--accent); }
        #player-screen { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:10000; }
        iframe { width: 100%; height: 100%; border: none; }
        .back-btn { --background: #45a29e; color: #000; margin: 15px; }

        @media (max-width: 700px) { .episode-item { width: 100%; } .aramapanelyazi { width: 120px; } }
    </style>
</head>
<body>

<div id="loading-overlay">
    <ion-spinner name="crescent"></ion-spinner>
    <p id="loading-text">Yükleniyor...</p>
</div>

<div class="aramapanel">
    <div class="aramapanelsol">
        <div class="logo"><img src="https://i.hizliresim.com/t6e66bt.png"></div>
        <div class="logoisim">ME TV</div>
    </div>
    <div class="aramapanelsag">
        <form onsubmit="event.preventDefault(); searchSeries();">
            <input type="text" id="seriesSearch" placeholder="Dizi Ara..." class="aramapanelyazi" oninput="searchSeries()">
            <input type="submit" value="ARA" class="aramapanelbuton">
        </form>
    </div>
</div>

<div id="main-screen">
    <div class="grid" id="movie-grid"></div>
</div>

<div id="episodes-screen" class="hidden">
    <ion-button class="back-btn" onclick="showMain()">← GERİ DÖN</ion-button>
    <div id="episode-content"></div>
</div>

<div id="player-screen">
    <ion-button style="position:absolute; top:10px; right:10px; z-index:11" color="danger" onclick="closePlayer()">KAPAT</ion-button>
    <div id="video-container" style="width:100%; height:100%;"></div>
</div>

const proxy = "https://api.codetabs.com/v1/proxy/?quest=";

function toggleLoading(show, text = "Yükleniyor...") {
    const loader = document.getElementById('loading-overlay');
    document.getElementById('loading-text').innerText = text;
    loader.style.display = show ? 'flex' : 'none';
}

function renderMain(filter = "") {
    const grid = document.getElementById('movie-grid');
    grid.innerHTML = "";
    const filtered = diziler.filter(d => d.title.toLowerCase().includes(filter.toLowerCase()));
    
    filtered.forEach((dizi) => {
        // Orijinal listedeki index'i bul (fetchEpisodes için)
        const originalIndex = diziler.findIndex(item => item.title === dizi.title);
        grid.innerHTML += `
            <div class="card" onclick="fetchEpisodes(${originalIndex})">
                ${dizi.imdb !== '0.0' ? `<div class="badge-imdb">⭐ ${dizi.imdb}</div>` : ''}
                <img src="${dizi.img}" loading="lazy">
                <div class="card-info"><div class="card-title">${dizi.title}</div></div>
            </div>`;
    });
}

function searchSeries() {
    const term = document.getElementById('seriesSearch').value;
    renderMain(term);
}

async function fetchEpisodes(index) {
    const dizi = diziler[index];
    toggleLoading(true, "Bölümler listeleniyor...");
    try {
        const response = await fetch(proxy + encodeURIComponent(dizi.link));
        const html = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, "text/html");
        const items = doc.querySelectorAll('.episode-item, .episodes li');
        let episodesHTML = '';
        items.forEach(item => {
            const link = item.querySelector('a')?.getAttribute('href');
            if(!link) return;
            const title = item.querySelector('.name, .duration')?.innerText || "Bölüm";
            const epLabel = item.querySelector('.episode, .title')?.innerText || "Yeni Bölüm";
            const img = item.querySelector('img')?.src || dizi.img;
            const fullLink = link.startsWith('http') ? link : "https://www.dizipal1226.com" + link;
            episodesHTML += `
                <div class="episode-item">
                    <a href="javascript:void(0)" onclick="fetchEmbed('${fullLink}')">
                        <img src="${img}">
                        <div class="ep-info">
                            <span class="ep-sub">${epLabel}</span>
                            <span class="ep-title">${title}</span>
                        </div>
                    </a>
                </div>`;
        });
        document.getElementById('episode-content').innerHTML = `
            <div class="bolum-header">
                <img src="${dizi.img}">
                <div><h2>${dizi.title}</h2><p>⭐ IMDb: ${dizi.imdb}</p></div>
            </div>
            <div class="last-episodes">${episodesHTML || '<p style="padding:20px;">Bölüm bulunamadı.</p>'}</div>`;
        document.getElementById('main-screen').classList.add('hidden');
        document.getElementById('episodes-screen').classList.remove('hidden');
        window.scrollTo(0,0);
    } catch (e) { alert("Bağlantı hatası!"); }
    toggleLoading(false);
}

async function fetchEmbed(bolumLink) {
    toggleLoading(true, "Video hazırlanıyor...");
    try {
        const response = await fetch(proxy + encodeURIComponent(bolumLink));
        const html = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, "text/html");
        let embedUrl = doc.querySelector('#vast_new iframe')?.getAttribute('src') ||
                       doc.querySelector('.series-player-container iframe')?.getAttribute('src');
        if (embedUrl) {
            if(embedUrl.startsWith('//')) embedUrl = 'https:' + embedUrl;
            openPlayer(embedUrl);
        } else { alert("Kaynak bulunamadı."); }
    } catch (e) { alert("Hata oluştu."); }
    toggleLoading(false);
}

function openPlayer(url) {
    document.getElementById('player-screen').style.display = 'block';
    document.getElementById('video-container').innerHTML = `<iframe src="${url}" allowfullscreen scrolling="no" allow="autoplay; encrypted-media"></iframe>`;
}
function closePlayer() { document.getElementById('player-screen').style.display = 'none'; document.getElementById('video-container').innerHTML = ''; }
function showMain() { document.getElementById('main-screen').classList.remove('hidden'); document.getElementById('episodes-screen').classList.add('hidden'); }

// Sayfa ilk açıldığında dizileri getir
renderMain();
</script>
