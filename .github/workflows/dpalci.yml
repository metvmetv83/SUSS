name: DiziPal URL Auto-Updater

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-url:
    runs-on: ubuntu-latest
    # Yazma izni eklendi (Dosyaları güncelleyebilmesi için şart)
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Update Script
        id: run_script
        run: |
          python dpalci.py
        # Hata olsa bile commit adımına geçmesini sağlar
        continue-on-error: true

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          # Eğer değişiklik varsa commit yap ve pushla
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Auto-update: DiziPal URL ve Dizi Listesi"
            git push
          fi
