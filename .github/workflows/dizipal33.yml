name: DiziPal33 Film & Dizi Çekici

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # 6 saatte bir

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Repo klonla
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerekli paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Botu çalıştır
        run: |
          python dizipal33.py

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add *.m3u
          git commit -m "📺 DiziPal33 otomatik güncelleme" || echo "Değişiklik yok"
          git push
