name: Dizipaluk 

on:
  schedule:
    - cron: '0 0 * * *' # Her gece 00:00'da çalışır
  workflow_dispatch:      # Manuel çalıştırma butonu ekler

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Kütüphaneleri Kur
        run: |
          pip install cloudscraper

      - name: Botu Çalıştır
        run: python dizipaluk.py

      - name: Veriyi GitHub'a Pushla
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add filmler.json
          git commit -m "Güncel film listesi: $(date)" || echo "Değişiklik yok"
          git push
