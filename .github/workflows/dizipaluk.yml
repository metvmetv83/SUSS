name: Dizipal Scraper Bot

on:
  schedule:
    - cron: '0 0 * * *' # Her gün gece 00:00'da otomatik çalışır
  workflow_dispatch:      # Manuel başlatma butonu sağlar

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Dosyayı geri yazabilmek için izin

    steps:
      - name: Repo Kontrol
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları ve Playwright Kur
        run: |
          pip install playwright playwright-stealth
          playwright install chromium
          playwright install-deps

      - name: Scraper'ı Çalıştır
        run: python dizipaluk.py

      - name: Verileri Kaydet ve Pushla
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          if [ -f filmler.json ]; then
            git add filmler.json
            git commit -m "Güncel film listesi: $(date)" || echo "Değişiklik yok"
            git push
          else
            echo "Dosya bulunamadı, işlem atlanıyor."
          fi
