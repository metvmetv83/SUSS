name: Yap Guncelleyici

on:
  schedule:
    - cron: '0 */4 * * *' # 4 saatte bir çalışır
  workflow_dispatch: # Manuel çalıştırma butonu ekler

permissions:
  contents: write

jobs:
  scrape_and_update:
    runs-on: ubuntu-latest
    concurrency: 
      group: scraper-gain
      cancel-in-progress: true

    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Sistem Paketlerini Yukle
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Python Kutuphanelerini Yukle
        run: |
          python -m pip install --upgrade pip
          # Scriptinizin çalışması için gerekli kütüphaneler:
          pip install requests beautifulsoup4 urllib3

      - name: Botu Calistir
        run: |
          # Scriptiniz Selenium kullanmadığı için xvfb-run teknik olarak zorunlu değil 
          # ama hata vermez, kalabilir.
          xvfb-run python yap.py

      - name: Degisiklikleri Kaydet ve Push Et
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          
          # 1. Uzak depodaki olası değişiklikleri çek
          git pull --rebase origin main
          
          # 2. Dosyayı ekle (Dosya yoksa hata almamak için kontrol eklenebilir)
          if [ -f panel.m3u ]; then
            git add panel.m3u
          fi
          
          # 3. Eğer dosya değişmediyse işlemi durdur
          git diff --cached --quiet || (git commit -m "Gani Veri Guncelleme: $(date +'%Y-%m-%d %H:%M')" && git push origin main)
