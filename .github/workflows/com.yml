name: Python Stream Worker

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  run:
    runs-on: windows-latest

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pip güncelle
        run: |
          python -m pip install --upgrade pip

      - name: Gerekli paketleri yükle
        run: |
          pip install flask requests beautifulsoup4 urllib3 yt-dlp

      - name: yt-dlp kontrol
        run: |
          yt-dlp --version

      - name: Server başlat
        run: |
          python server.pyw
