name: Build M3U8 Playlist

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # 30 dakikada bir

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Repo'yu çek
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Python kur
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ yt-dlp kur
      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      # 4️⃣ JSON → M3U8 çalıştır
      - name: Generate playlist
        run: |
          python common.py

      # 5️⃣ Değişiklik var mı kontrol et
      - name: Commit & Push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if [[ -n "$(git status --porcelain)" ]]; then
            git add output.m3u8
            git commit -m "Update playlist"
            git push
          else
            echo "Değişiklik yok"
          fi
