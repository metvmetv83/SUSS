name: Python Stream Worker

on:
  workflow_dispatch:   # Elle çalıştırma
  push:
    branches: [ "main" ]

jobs:
  run:
    runs-on: windows-latest

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pip güncelle
        run: |
          python -m pip install --upgrade pip

      - name: Gerekli paketleri yükle
        run: |
          pip install requests beautifulsoup4 urllib3 yt-dlp

      - name: yt-dlp doğrula
        run: |
          yt-dlp --version

      # 🔽 BURADA ÇALIŞTIRILACAK DOSYAYI SEÇ
      - name: Script çalıştır
        run: |
          python server.pyw
