name: Run Python Scripts

on:
  workflow_dispatch:
    inputs:
      script_choice:
        description: 'Çalıştırılacak Script'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - github
        - server
        - status_md
        - test_common
        - custom
      custom_command:
        description: 'Özel Komut (custom seçeneği için)'
        required: false
        default: ''
        type: string

  schedule:
    - cron: '0 */6 * * *'
    - cron: '0 0 * * *'

  push:
    branches: [ main, master ]
    paths:
      - '**.py'
      - '**.pyw'
      - 'config.json'
      - 'requirements.txt'
      - 'common.py'

  pull_request:
    branches: [ main, master ]

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg git
        
    - name: Cache Python packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade yt-dlp
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install requests beautifulsoup4
    
    - name: Check common.py functions
      run: |
        echo "=== common.py testi ==="
        python -c "
import common
print('common.py başarıyla import edildi')
print(f'CONFIG_FILE: {common.CONFIG_FILE}')
print(f'LOG_FILE: {common.LOG_FILE}')
print('Test fonksiyonları:')
common.log('Test log mesajı')
print(f'Sanitize filename: {common.sanitize_filename("Test Kanalı İşçi Öğle")}')
        "
    
    - name: Create config files if not exist
      run: |
        if [ ! -f config.json ]; then
          echo '{"channels": [], "ONLY_HIGHEST": 1, "VIEW_MODE": 0}' > config.json
          echo "config.json oluşturuldu"
        fi
        
        if [ ! -d m3u8 ]; then
          mkdir m3u8
          echo "m3u8 dizini oluşturuldu"
        fi
        
        if [ ! -f tv.m3u8 ]; then
          echo "#EXTM3U" > tv.m3u8
          echo "tv.m3u8 oluşturuldu"
        fi
        
        if [ ! -f log.txt ]; then
          touch log.txt
          echo "log.txt oluşturuldu"
        fi
    
    - name: Run selected script
      run: |
        echo "Seçilen script: ${{ github.event.inputs.script_choice }}"
        echo "Özel komut: ${{ github.event.inputs.custom_command }}"
        
        case "${{ github.event.inputs.script_choice }}" in
          "all")
            echo "Tüm scriptler çalıştırılıyor..."
            if [ -f github.pyw ]; then
              echo "github.pyw çalıştırılıyor..."
              python github.pyw || echo "github.pyw hata verdi"
            fi
            if [ -f server.pyw ]; then
              echo "server.pyw çalıştırılıyor..."
              timeout 30 python server.pyw &
              SERVER_PID=$!
              sleep 5
              curl -f http://localhost:5000 || echo "Sunucu testi başarısız"
              kill $SERVER_PID 2>/dev/null || true
            fi
            if [ -f status_md.py ]; then
              echo "status_md.py çalıştırılıyor..."
              python status_md.py || echo "status_md.py hata verdi"
            fi
            ;;
          "github")
            if [ -f github.pyw ]; then
              python github.pyw
            else
              echo "github.pyw bulunamadı!"
              exit 1
            fi
            ;;
          "server")
            if [ -f server.pyw ]; then
              timeout 60 python server.pyw &
              SERVER_PID=$!
              sleep 10
              curl -f http://localhost:5000 || echo "Sunucu erişilemez"
              kill $SERVER_PID 2>/dev/null || true
            else
              echo "server.pyw bulunamadı!"
              exit 1
            fi
            ;;
          "status_md")
            if [ -f status_md.py ]; then
              python status_md.py
              if [ -f STATUS.md ]; then
                echo "=== STATUS.md İLK 20 SATIR ==="
                head -20 STATUS.md
              fi
            else
              echo "status_md.py bulunamadı!"
              exit 1
            fi
            ;;
          "test_common")
            echo "=== common.py DETAYLI TEST ==="
            python -c "
import common
import json
import os

print('1. Log fonksiyonu testi:')
common.log('GitHub Actions test logu', to_file=True, to_console=False)

print('2. Config işlemleri:')
channels, only_highest, view_mode = common.load_config()
print(f'Kanal sayısı: {len(channels)}')
print(f'Only highest: {only_highest}')
print(f'View mode: {view_mode}')

print('3. Dosya adı sanitize:')
test_names = ['TRT HABER', 'NTV Spor', 'Kanal D Türkçe']
for name in test_names:
    clean = common.sanitize_filename(name)
    print(f'  \"{name}\" -> \"{clean}\"')

print('4. YouTube fonksiyonları testi (mock):')
try:
    result = common.search_youtube_innertube('test')
    print(f'  YouTube search: {result}')
except Exception as e:
    print(f'  YouTube search hatası (beklenen): {type(e).__name__}')

print('5. IP adresi alma:')
ip = common.get_ipv4_address()
print(f'  IPv4: {ip}')

print('Test tamamlandı!')
            "
            ;;
          "custom")
            if [ -n \"${{ github.event.inputs.custom_command }}\" ]; then
              echo \"Özel komut çalıştırılıyor: ${{ github.event.inputs.custom_command }}\"
              eval \"${{ github.event.inputs.custom_command }}\"
            else
              echo \"Özel komut belirtilmedi!\"
              exit 1
            fi
            ;;
        esac
    
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: script-outputs-${{ matrix.python-version }}
        path: |
          log.txt
          config.json
          m3u8/
          tv.m3u8
          STATUS.md
        retention-days: 7
    
    - name: Show execution summary
      if: always()
      run: |
        echo "=== ÇALIŞTIRMA ÖZETİ ==="
        echo "Python version: ${{ matrix.python-version }}"
        echo "Workflow: ${{ github.event.inputs.script_choice }}"
        echo ""
        
        echo "=== DOSYA DURUMLARI ==="
        ls -la *.py *.pyw 2>/dev/null || echo "Python dosyası bulunamadı"
        
        echo ""
        echo "=== LOG DOSYASI SON 20 SATIR ==="
        if [ -f log.txt ]; then
          tail -20 log.txt
        else
          echo "log.txt bulunamadı"
        fi
        
        if [ -f STATUS.md ]; then
          echo ""
          echo "=== STATUS.md SATIR SAYISI ==="
          wc -l STATUS.md
        fi
