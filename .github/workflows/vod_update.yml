name: VOD M3U Güncelleme

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  VODGuncelle:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4.2.2

      - name: Python 3.11 Yükle
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Gereksinimleri Kur
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: vod_m3u.py Çalıştır
        run: python vod_m3u.py

      - name: Değişiklik Kontrolü
        id: degisiklik_kontrol
        run: |
          git diff --quiet . || echo "degisiklik=true" >> $GITHUB_OUTPUT

      - name: Değişiklikleri Commit Et
        if: steps.degisiklik_kontrol.outputs.degisiklik == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vodden.m3u
          git commit -m "🔄 VOD M3U güncellendi" -m "📺 Otomatik işlem - $GITHUB_SHA"
          git push
