name: VOD M3U Güncelleme

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  VODGuncelle:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gereksinimleri Kur
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: VOD scriptini çalıştır
        run: |
          python vod_m3u.py
          echo "📂 Oluşan dosyalar:"
          ls -lah

      - name: Değişiklik var mı kontrol et
        id: kontrol
        run: |
          if git status --porcelain | grep vod_final.m3u; then
            echo "degisiklik=true" >> $GITHUB_OUTPUT
          else
            echo "degisiklik=false" >> $GITHUB_OUTPUT
          fi

      - name: Değişiklikleri commit et
        if: steps.kontrol.outputs.degisiklik == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add vod_final.m3u
          git commit -m "🔄 VOD M3U otomatik güncellendi"
          git push

      - name: Değişiklik yok
        if: steps.kontrol.outputs.degisiklik == 'false'
        run: echo "ℹ️ vod_final.m3u değişmedi, commit atlanıyor"
