name: Giniko Kanal Tarama

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bagımlılık Kur
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Kanalları Tara
        run: python scan.py

      - name: Kanal sayısını kontrol et
        run: |
          COUNT=$(python3 -c "import json; d=json.load(open('channels.json')); print(len(d))")
          echo "Bulunan kanal: $COUNT"
          if [ "$COUNT" -lt "10" ]; then
            echo "Kanal sayısı çok az ($COUNT), commit yapılmıyor!"
            exit 1
          fi

      - name: Commit ve Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channels5.json
          git diff --staged --quiet && echo "Degisiklik yok" || (git commit -m "Kanal tarama: $(date +'%Y-%m-%d')" && git push)
