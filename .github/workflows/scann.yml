name: Giniko Kanal Tarama

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bagımlılıkları Kur
        run: pip install aiohttp

      - name: Kanalları Tara
        run: python scan.py

      - name: Commit ve Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channels.json
          git diff --staged --quiet || git commit -m "Kanal tarama: $(date +'%Y-%m-%d')" && git push
