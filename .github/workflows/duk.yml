name: Dizipal Bot Update

on:
  schedule:
    - cron: '0 */3 * * *' # Her 3 saatte bir otomatik çalışır
  workflow_dispatch:      # Manuel başlatma butonu (Actions sekmesinden)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Çek
        uses: actions/checkout@v3

      - name: Python 3.9 Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper beautifulsoup4

      - name: Botu Çalıştır (Scraping)
        run: python bot.py

      - name: JSON Dosyasını Kaydet ve Pushla
        run: |
          git config --global user.name 'GitHub Bot'
          git config --global user.email 'bot@github.com'
          git add filmler.json
          git commit -m "Veriler güncellendi: $(date)" || echo "Değişiklik yok."
          git push
