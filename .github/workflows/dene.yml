name: aHobii

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape_and_update:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Repo'yu tam history ile çek
      - name: Depoyu Cek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Python kur
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3️⃣ Chrome + xvfb kur
      - name: Sistem Paketlerini Yukle
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb

      # 4️⃣ Python kütüphaneleri
      - name: Python Kutuphanelerini Yukle
        run: |
          pip install --upgrade pip
          pip install selenium undetected-chromedriver

      # 5️⃣ Botu çalıştır
      - name: Botu Calistir
        run: |
          xvfb-run python dene.py

      # 6️⃣ Commit + Push (Çakışma ÇÖZÜLMÜŞ)
      - name: Degisiklikleri Kaydet
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"

          git add gani.json
          git diff --cached --quiet && echo "Degisiklik yok" && exit 0

          git commit -m "Gani Guncellendi: $(date +'%Y-%m-%d %H:%M')"

          # Güvenli force push (bot projeleri için ideal)
          git push --force-with-lease origin main
