name: Dizi Kazıyıcı

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install curl_cffi pyyaml

      - name: Run Script
        run: python hdf/hdf.py --max-pages 5 --max-episodes 10

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hdf/
          git commit -m "Update dizi verileri" || echo "Değişiklik yok"
          git push
