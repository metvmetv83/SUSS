name: DIZI-KAZIYICI-V1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: |
          python -c "
import requests, json, os
from datetime import datetime

worker = 'https://hdfilmdizijson.64fetih.workers.dev'
diziler = []

for sayfa in range(1, 4):
    r = requests.get(f'{worker}/?tip=dizi&sayfa={sayfa}')
    if r.status_code == 200:
        for d in r.json().get('veriler', []):
            if not d.get('hata'):
                diziler.append(d)

os.makedirs('hdf', exist_ok=True)
with open('hdf/diziler.json', 'w') as f:
    json.dump({'tarih': str(datetime.now()), 'diziler': diziler}, f, ensure_ascii=False, indent=2)

print(f'{len(diziler)} dizi kaydedildi')
"
      - run: |
          git config user.name "actions"
          git config user.email "actions@github.com"
          git add hdf/diziler.json
          git commit -m "dizi güncelle" || echo "no change"
          git push
