name: Dizi Kazıyıcı (Worker)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Kurulum
      run: pip install requests
    
    - name: Dizileri çek
      run: |
        python -c "
import requests, json, os
from datetime import datetime

WORKER = 'https://hdfilmdizijson.64fetih.workers.dev'
tum_diziler = []

for sayfa in range(1, 6):
    print(f'Sayfa {sayfa}...')
    try:
        r = requests.get(f'{WORKER}/?tip=dizi&sayfa={sayfa}', timeout=30)
        if r.status_code == 200:
            veri = r.json()
            for dizi in veri.get('veriler', []):
                if not dizi.get('hata'):
                    tum_diziler.append(dizi)
    except Exception as e:
        print(f'Hata: {e}')

os.makedirs('hdf', exist_ok=True)
with open('hdf/diziler.json', 'w', encoding='utf-8') as f:
    json.dump({
        'tarih': datetime.now().isoformat(),
        'toplam': len(tum_diziler),
        'diziler': tum_diziler
    }, f, ensure_ascii=False, indent=2)

print(f'Toplam {len(tum_diziler)} dizi kaydedildi')
"
    
    - name: GitHub'a gönder
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add hdf/diziler.json
        git diff --staged --quiet || (git commit -m "Update diziler.json" && git push)
