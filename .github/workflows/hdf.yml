name: HDFilm Dizi Kazıyıcı

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Kaç sayfa taranacak? (boş bırak=tümü)'
        required: false
        type: number
      max_episodes:
        description: 'Her dizi için max bölüm'
        required: false
        default: 10
        type: number

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Bağımlılıkları yükle
      run: |
        pip install --upgrade pip
        pip install curl_cffi pyyaml
    
    - name: Dizileri kazı (hdf.py)
      run: |
        python hdf/hdf.py --max-pages ${{ github.event.inputs.max_pages }} --max-episodes ${{ github.event.inputs.max_episodes || 10 }}
      continue-on-error: false
    
    - name: GitHub'a gönder
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add hdf/*.json hdf/*.yaml 2>/dev/null || true
        if ! git diff --quiet && ! git diff --staged --quiet; then
          git commit -m "🤖 Dizi verileri güncellendi $(date '+%Y-%m-%d %H:%M')"
          git push
          echo "✅ Değişiklikler gönderildi"
        else
          echo "ℹ️ Yeni değişiklik yok"
        fi
