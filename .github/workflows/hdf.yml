name: Otomatik Film/Dizi Güncelleyici (SUSS HDF)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      tip:
        description: 'Ne kazınsın? (dizi/film/herikisi)'
        required: false
        default: 'herikisi'
        type: choice
        options:
          - dizi
          - film
          - herikisi
      max_sayfa:
        description: 'Kaç sayfa taranacak? (boş bırak=tümü)'
        required: false
        type: number
      max_episodes:
        description: 'Her dizi için max bölüm (varsayılan: 20)'
        required: false
        type: number
        default: 20

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v3
      with:
        fetch-depth: 1
    
    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install curl_cffi pyyaml
    
    - name: Botu Çalıştır (Her İkisi)
      if: github.event.inputs.tip == 'herikisi' || github.event_name == 'schedule'
      run: |
        python hdf/hdf.py --both --max-episodes ${{ github.event.inputs.max_episodes || 20 }}
      env:
        PYTHONUNBUFFERED: 1
    
    - name: Botu Çalıştır (Sadece Dizi)
      if: github.event.inputs.tip == 'dizi'
      run: |
        python hdf/hdf.py --dizi --max-episodes ${{ github.event.inputs.max_episodes || 20 }}
    
    - name: Botu Çalıştır (Sadece Film)
      if: github.event.inputs.tip == 'film'
      run: |
        python hdf/hdf.py --film
    
    - name: JSON Validasyonu
      run: |
        if [ -f "hdf/data.json" ]; then
          echo "✅ JSON dosyası kontrol ediliyor..."
          python -c "import json; json.load(open('hdf/data.json'))"
          echo "✅ JSON geçerli"
        fi
    
    - name: Değişiklikleri GitHub'a Geri Yükle
      run: |
        git config --global user.name "GitHub Otomasyonu"
        git config --global user.email "actions@github.com"
        git add hdf/data.json hdf/data.yaml 2>/dev/null || true
        if ! git diff --quiet && ! git diff --staged --quiet; then
          git commit -m "🤖 Otomatik güncelleme: Film/Dizi verileri"
          git push
          echo "✅ Değişiklikler GitHub'a gönderildi"
        else
          echo "ℹ️ Yeni değişiklik yok"
        fi
    
    - name: Başarılı Güncelleme Bildirimi
      if: success()
      run: echo "🎉 Güncelleme başarıyla tamamlandı!"
    
    - name: Hata Bildirimi
      if: failure()
      run: echo "❌ Güncelleme sırasında hata oluştu!"
