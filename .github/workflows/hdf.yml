name: Dizi Kazıyıcı (Worker)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Kaç sayfa çekilsin?'
        required: false
        default: 5
        type: number

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Bağımlılıkları yükle
      run: pip install requests
    
    - name: Worker'dan dizileri çek
      run: |
        python -c "
import json, requests
from datetime import datetime

WORKER = 'https://hdfilmdizijson.64fetih.workers.dev'
tum_diziler = []

for sayfa in range(1, ${{ github.event.inputs.max_pages || 5 }} + 1):
    print(f'Sayfa {sayfa}...')
    r = requests.get(f'{WORKER}/?tip=dizi&sayfa={sayfa}', timeout=30)
    if r.status_code == 200:
        veri = r.json()
        for dizi in veri.get('veriler', []):
            if not dizi.get('hata'):
                tum_diziler.append(dizi)

sonuc = {
    'metadata': {
        'tarih': datetime.now().isoformat(),
        'toplam': len(tum_diziler)
    },
    'diziler': tum_diziler
}

with open('hdf/diziler.json', 'w', encoding='utf-8') as f:
    json.dump(sonuc, f, ensure_ascii=False, indent=2)

print(f'Toplam {len(tum_diziler)} dizi kaydedildi')
"
    
    - name: GitHub'a gönder
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add hdf/diziler.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Diziler güncellendi" && git push)
